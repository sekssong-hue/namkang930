<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GPS 선박 관제 - 관리자 강제 운항 해제 시스템</title>

  <!-- PWA Meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1117">

  <!-- Leaflet 지도 라이브러리 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #0d1117;
      --panel-bg: #161b22;
      --accent-color: #00f2fe;
      --accent-blue: #2563eb;
      --accent-blue-bright: #38bdf8;
      --accent-green: #2ea043;
      --accent-green-bright: #4ade80;
      --accent-red: #ff7b72;
      --accent-red-bright: #ff6b6b;
      --accent-yellow: #fbbf24;
      --text-main: #ffffff;
      --text-sub: #d0d7de;
      --border-color: #30363d;
      --left-panel-width: 44%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-size: 16px;
      padding: clamp(12px, 2vw, 20px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--border-color);
      flex-wrap: wrap;
      gap: 12px;
    }

    header .title-group h1 {
      font-size: clamp(1.45rem, 2.5vw, 1.95rem);
      color: var(--accent-color);
      font-weight: 800;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header .title-group .sub-title {
      font-size: clamp(0.95rem, 1.3vw, 1.1rem);
      color: var(--text-sub);
      margin-top: 4px;
    }

    .server-status-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(74, 222, 128, 0.16);
      border: 2px solid var(--accent-green-bright);
      padding: 8px 16px;
      border-radius: 24px;
      font-size: clamp(0.95rem, 1.2vw, 1.1rem);
      font-weight: 800;
      color: var(--accent-green-bright);
      transition: all 0.3s ease;
    }

    .server-status-badge.disconnected {
      background: rgba(255, 107, 107, 0.18);
      border-color: var(--accent-red-bright);
      color: var(--accent-red-bright);
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--accent-green-bright);
      box-shadow: 0 0 10px var(--accent-green-bright);
      animation: pulse 1.5s infinite;
    }

    .server-status-badge.disconnected .status-dot {
      background-color: var(--accent-red-bright);
      box-shadow: 0 0 10px var(--accent-red-bright);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.25); }
    }

    .admin-action-bar {
      background: var(--panel-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .summary-metrics {
      display: flex;
      align-items: stretch;
      gap: clamp(10px, 1.8vw, 18px);
      flex-wrap: wrap;
      flex: 1;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: clamp(1rem, 1.25vw, 1.15rem);
      background: rgba(0, 0, 0, 0.28);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border-color);
      min-width: 155px;
    }

    .metric-item.sailing-box {
      border-color: rgba(74, 222, 128, 0.55);
      background: rgba(74, 222, 128, 0.08);
    }

    .metric-item.waiting-box {
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.08);
    }

    .metric-item.released-box {
      border-color: rgba(255, 107, 107, 0.55);
      background: rgba(255, 107, 107, 0.08);
    }

    .metric-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .metric-label {
      color: var(--text-main);
      font-weight: 700;
      font-size: clamp(1rem, 1.2vw, 1.12rem);
    }

    .metric-val {
      font-weight: 900;
      font-size: clamp(1.25rem, 1.6vw, 1.5rem);
      font-family: monospace;
      color: var(--accent-color);
    }
    .metric-val.sailing-count { color: var(--accent-green-bright); }
    .metric-val.waiting-count { color: var(--accent-blue-bright); }
    .metric-val.released-count { color: var(--accent-red-bright); }

    .metric-ship-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
      max-width: 280px;
    }

    .ship-name-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(0.85rem, 1vw, 0.98rem);
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.22);
      white-space: nowrap;
    }

    .ship-color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px currentColor;
    }

    .ship-name-chip.sailing {
      background: rgba(74, 222, 128, 0.18);
      border-color: var(--accent-green-bright);
      color: #86efac;
    }

    .ship-name-chip.waiting {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent-blue-bright);
      color: #7dd3fc;
    }

    .ship-name-chip.released {
      background: rgba(255, 107, 107, 0.18);
      border-color: var(--accent-red-bright);
      color: #fca5a5;
    }

    .btn-force-all-stop {
      background: #dc2626;
      color: #ffffff;
      border: 2px solid #f87171;
      border-radius: 10px;
      padding: clamp(11px, 1.4vw, 14px) clamp(16px, 2vw, 22px);
      font-size: clamp(1rem, 1.25vw, 1.15rem);
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
      transition: all 0.2s ease;
      align-self: center;
    }

    .btn-force-all-stop:hover {
      background: #ef4444;
      transform: translateY(-1px);
    }

    /* 좌우 조절 가능 레이아웃 */
    .admin-grid {
      display: flex;
      align-items: stretch;
      gap: 0;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .left-panel {
      flex: 0 0 var(--left-panel-width);
      min-width: 280px;
      max-width: calc(100% - 300px);
    }

    .right-panel {
      flex: 1 1 auto;
      min-width: 280px;
    }

    .panel-resizer {
      width: 14px;
      cursor: col-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      user-select: none;
      touch-action: none;
      position: relative;
      transition: background-color 0.15s ease;
    }

    .panel-resizer::before {
      content: "";
      width: 4px;
      height: 64px;
      border-radius: 4px;
      background: var(--border-color);
      transition: all 0.15s ease;
    }

    .panel-resizer:hover::before,
    .panel-resizer.dragging::before {
      background: var(--accent-color);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
      height: 90px;
    }

    .panel-box {
      background: var(--panel-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      height: 100%;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1.5px solid var(--border-color);
      flex-wrap: wrap;
      gap: 8px;
    }

    .panel-title {
      font-size: clamp(1.15rem, 1.45vw, 1.35rem);
      font-weight: 800;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-toggle-all {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 7px;
      padding: 6px 11px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-toggle-all:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--accent-color);
    }

    .btn-toggle-all.active-trail {
      background: rgba(0, 242, 254, 0.2);
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .vessel-list-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
      max-height: clamp(360px, 62vh, 720px);
    }

    .vessel-card {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid var(--border-color);
      border-left-width: 6px;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .vessel-card.sailing {
      background: rgba(74, 222, 128, 0.08);
    }

    .vessel-card.waiting {
      background: rgba(56, 189, 248, 0.08);
    }

    .vessel-card.released {
      background: rgba(255, 107, 107, 0.08);
    }

    .vessel-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .vessel-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .vessel-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .vessel-route-summary {
      font-size: clamp(0.95rem, 1.12vw, 1.06rem);
      font-weight: 700;
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.24);
      padding: 6px 10px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .route-arrow {
      color: var(--accent-color);
      font-weight: 900;
    }

    .vessel-mini-meta {
      font-size: clamp(0.9rem, 1.05vw, 1rem);
      font-weight: 700;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .vessel-name {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: clamp(1.15rem, 1.4vw, 1.3rem);
      font-weight: 800;
      color: #ffffff;
    }

    .vessel-status-tag {
      font-size: clamp(0.92rem, 1.1vw, 1.05rem);
      font-weight: 900;
      padding: 4px 11px;
      border-radius: 14px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .vessel-status-tag.sailing {
      background: rgba(74, 222, 128, 0.24);
      color: #86efac;
      border: 2px solid var(--accent-green-bright);
    }

    .vessel-status-tag.waiting {
      background: rgba(56, 189, 248, 0.24);
      color: #7dd3fc;
      border: 2px solid var(--accent-blue-bright);
    }

    .vessel-status-tag.released {
      background: rgba(255, 107, 107, 0.24);
      color: #fca5a5;
      border: 2px solid var(--accent-red-bright);
    }

    .btn-expand {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: clamp(0.9rem, 1.05vw, 1rem);
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .btn-expand:hover {
      background: rgba(0, 242, 254, 0.18);
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .vessel-detail-section {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding-top: 4px;
      border-top: 1px dashed rgba(255, 255, 255, 0.18);
    }

    .vessel-card.expanded .vessel-detail-section {
      display: flex;
    }

    .vessel-info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 12px;
      font-size: clamp(0.95rem, 1.15vw, 1.05rem);
      color: var(--text-sub);
      background: rgba(0, 0, 0, 0.28);
      padding: 10px 12px;
      border-radius: 8px;
    }

    .vessel-action-group {
      display: flex;
      gap: 10px;
      margin-top: 2px;
    }

    .btn-action {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: clamp(0.95rem, 1.15vw, 1.05rem);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-locate {
      background: rgba(0, 242, 254, 0.16);
      color: var(--accent-color);
      border: 1.5px solid var(--accent-color);
    }

    .btn-locate:hover {
      background: rgba(0, 242, 254, 0.32);
    }

    .btn-force-stop {
      background: rgba(255, 107, 107, 0.18);
      color: #fca5a5;
      border: 1.5px solid var(--accent-red-bright);
    }

    .btn-force-stop:hover {
      background: #ef4444;
      color: #fff;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: clamp(360px, 52vh, 620px);
      border-radius: 12px;
      border: 2px solid var(--border-color);
    }

    .admin-ship-badge {
      background: rgba(13, 17, 23, 0.96);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
      white-space: nowrap;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.65);
      transition: transform 0.2s ease;
    }

    .admin-ship-badge:hover {
      transform: scale(1.06);
      z-index: 1000;
    }

    @media (max-width: 900px) {
      body { height: auto; }
      .admin-grid { flex-direction: column; gap: 14px; }
      .left-panel, .right-panel {
        flex: 1 1 auto;
        min-width: 100%;
        max-width: 100%;
      }
      .panel-resizer { display: none; }
      #map { min-height: 400px; }
      .vessel-list-container { max-height: 420px; }
      .metric-ship-list { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div class="title-group">
      <h1>🛡️ GPS 선박 관제 센터</h1>
      <div class="sub-title">실시간 선박 위치·항적·출발/도착지 추적 및 원격 통합 관리 모니터링</div>
    </div>
    <div id="server-badge" class="server-status-badge">
      <div class="status-dot"></div>
      <span id="server-text">서버 실시간 연결됨</span>
    </div>
  </header>

  <!-- 통합 제어 바 -->
  <div class="admin-action-bar">
    <div class="summary-metrics">
      <div class="metric-item">
        <div class="metric-header">
          <span class="metric-label">📋 등록 선박</span>
          <span class="metric-val" id="total-ships-count">0</span>
        </div>
        <div class="metric-ship-list" id="total-ships-names"></div>
      </div>

      <div class="metric-item sailing-box">
        <div class="metric-header">
          <span class="metric-label">🚢 운항 중</span>
          <span class="metric-val sailing-count" id="sailing-ships-count">0</span>
        </div>
        <div class="metric-ship-list" id="sailing-ships-names"></div>
      </div>

      <div class="metric-item waiting-box">
        <div class="metric-header">
          <span class="metric-label">⚓ 대기 중</span>
          <span class="metric-val waiting-count" id="waiting-ships-count">0</span>
        </div>
        <div class="metric-ship-list" id="waiting-ships-names"></div>
      </div>

      <div class="metric-item released-box">
        <div class="metric-header">
          <span class="metric-label">🛑 운항 해제</span>
          <span class="metric-val released-count" id="released-ships-count">0</span>
        </div>
        <div class="metric-ship-list" id="released-ships-names"></div>
      </div>
    </div>
    <button class="btn-force-all-stop" id="btn-force-all">
      🚨 전 선박 강제 운항 해제
    </button>
  </div>

  <!-- 메인 대시보드 -->
  <div class="admin-grid" id="admin-grid">
    <div class="panel-box left-panel" id="left-panel">
      <div class="panel-header">
        <div class="panel-title">🚢 실시간 선박 현황 목록</div>
        <div class="panel-controls">
          <button type="button" class="btn-toggle-all" id="btn-expand-all">▼ 전체 펼치기</button>
          <button type="button" class="btn-toggle-all" id="btn-collapse-all">▲ 전체 접기</button>
        </div>
      </div>
      <div class="vessel-list-container" id="vessel-list"></div>
    </div>

    <div class="panel-resizer" id="panel-resizer" title="좌우로 끌어 너비 조절 (더블클릭: 기본 비율)"></div>

    <div class="panel-box right-panel" id="right-panel">
      <div class="panel-header">
        <div class="panel-title">🗺️ 남강 GIS 위치 및 항적 지도</div>
        <div class="panel-controls">
          <button type="button" class="btn-toggle-all" id="btn-ratio-list">목록 넓게</button>
          <button type="button" class="btn-toggle-all" id="btn-ratio-even">50:50</button>
          <button type="button" class="btn-toggle-all" id="btn-ratio-map">지도 넓게</button>
          <button type="button" class="btn-toggle-all active-trail" id="btn-toggle-trails">〰️ 궤적 표시 중</button>
          <button type="button" class="btn-toggle-all" id="btn-clear-trails">🧹 궤적 초기화</button>
        </div>
      </div>
      <div id="map"></div>
    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCDtASlxPja0v95rc8k9A1O0tBzN0YdWWE",
      authDomain: "gis919-f55a2.firebaseapp.com",
      databaseURL: "https://gis919-f55a2-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gis919-f55a2",
      storageBucket: "gis919-f55a2.firebasestorage.app",
      messagingSenderId: "184269529193",
      appId: "1:184269529193:web:3a83ef37cf73f7a96682f8",
      measurementId: "G-G5Y6B2LLNJ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // GIS 지도 초기화 (진주 남강 중심 좌표)
    const map = L.map('map').setView([35.1880, 128.0838], 15);
    L.tileLayer('https://xdworld.vworld.kr/2d/Base/service/{z}/{x}/{y}.png', { 
      maxZoom: 19,
      attribution: '&copy; VWORLD'
    }).addTo(map);

    // ↔️ 좌우 패널 너비 조절 로직
    (function initPanelResizer() {
      const grid = document.getElementById('admin-grid');
      const resizer = document.getElementById('panel-resizer');
      const root = document.documentElement;
      const DEFAULT_WIDTH = '44%';

      function setLeftWidth(percentOrPx) {
        if (typeof percentOrPx === 'number') {
          const gridRect = grid.getBoundingClientRect();
          const minPx = 280;
          const maxPx = Math.max(minPx, gridRect.width - 314);
          const clamped = Math.min(Math.max(percentOrPx, minPx), maxPx);
          root.style.setProperty('--left-panel-width', `${clamped}px`);
        } else {
          root.style.setProperty('--left-panel-width', percentOrPx);
        }
        requestAnimationFrame(() => map.invalidateSize());
      }

      let isDragging = false;

      resizer.addEventListener('pointerdown', (e) => {
        if (window.innerWidth <= 900) return;
        isDragging = true;
        resizer.classList.add('dragging');
        resizer.setPointerCapture(e.pointerId);
        document.body.style.cursor = 'col-resize';
      });

      resizer.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const gridRect = grid.getBoundingClientRect();
        setLeftWidth(e.clientX - gridRect.left);
      });

      function stopDragging(e) {
        if (!isDragging) return;
        isDragging = false;
        resizer.classList.remove('dragging');
        document.body.style.cursor = '';
        if (e && resizer.hasPointerCapture(e.pointerId)) {
          resizer.releasePointerCapture(e.pointerId);
        }
        map.invalidateSize();
      }

      resizer.addEventListener('pointerup', stopDragging);
      resizer.addEventListener('pointercancel', stopDragging);
      resizer.addEventListener('dblclick', () => setLeftWidth(DEFAULT_WIDTH));

      document.getElementById('btn-ratio-list').addEventListener('click', () => setLeftWidth('56%'));
      document.getElementById('btn-ratio-even').addEventListener('click', () => setLeftWidth('50%'));
      document.getElementById('btn-ratio-map').addEventListener('click', () => setLeftWidth('34%'));
    })();

    // 선박별 고유 색상 팔레트
    const SHIP_COLOR_PALETTE = [
      "#00f2fe", // 시안
      "#4ade80", // 라임 그린
      "#fbbf24", // 앰버 옐로우
      "#f472b6", // 핑크
      "#a78bfa", // 바이올렛
      "#fb923c", // 오렌지
      "#38bdf8", // 스카이 블루
      "#2dd4bf", // 틸
      "#f87171", // 코랄 레드
      "#a3e635"  // 옐로우 그린
    ];
    const assignedShipColors = {};
    let colorCursor = 0;

    function getShipColor(key, shipName) {
      const seed = String(shipName || key || '');
      if (!assignedShipColors[key]) {
        let hash = 0;
        for (let i = 0; i < seed.length; i++) {
          hash = (hash * 31 + seed.charCodeAt(i)) >>> 0;
        }
        const idx = (hash + colorCursor++) % SHIP_COLOR_PALETTE.length;
        assignedShipColors[key] = SHIP_COLOR_PALETTE[idx];
      }
      return assignedShipColors[key];
    }

    // 진주 남강 주요 지점 좌표 (출발지/도착지 자동 추정용)
    const NAMGANG_LANDMARKS = [
      { name: "물빛나루쉼터", lat: 35.1883, lng: 128.0846 },
      { name: "촉석루·진주성", lat: 35.1904, lng: 128.0785 },
      { name: "진주교", lat: 35.1897, lng: 128.0812 },
      { name: "천수교", lat: 35.1872, lng: 128.0895 },
      { name: "경남문화예술회관", lat: 35.1862, lng: 128.0958 },
      { name: "망진나루", lat: 35.1785, lng: 128.1180 }
    ];

    const recordedDepartures = {};

    function findNearestLandmark(lat, lng) {
      const nLat = Number(lat);
      const nLng = Number(lng);
      if (!nLat || !nLng || isNaN(nLat) || isNaN(nLng) || nLat <= 0 || nLng <= 0) {
        return null;
      }
      let best = null;
      let minDist = Infinity;
      for (const spot of NAMGANG_LANDMARKS) {
        const d = Math.hypot(nLat - spot.lat, nLng - spot.lng);
        if (d < minDist) {
          minDist = d;
          best = spot.name;
        }
      }
      if (best && minDist < 0.008) return best;
      return `남강 (${nLat.toFixed(4)}, ${nLng.toFixed(4)})`;
    }

    function resolveDepartureAndArrival(key, ship, hasValidGps, isSailing, hasEndTime) {
      const explicitDep =
        ship.departure || ship.origin || ship.startLocation || ship.startPlace || ship.from || '';
      const explicitArr =
        ship.arrival || ship.destination || ship.endLocation || ship.endPlace || ship.to || '';

      const currentSpot = hasValidGps ? findNearestLandmark(ship.lat, ship.lng) : null;

      let departure = String(explicitDep || '').trim();
      if (!departure) {
        if (hasValidGps && (isSailing || hasEndTime)) {
          if (!recordedDepartures[key] && currentSpot) {
            recordedDepartures[key] = currentSpot;
          }
          departure = recordedDepartures[key] || currentSpot || '-';
        } else if (hasValidGps && currentSpot) {
          departure = currentSpot;
        } else {
          departure = recordedDepartures[key] || '-';
        }
      } else if (currentSpot) {
        recordedDepartures[key] = departure;
      }

      let arrival = String(explicitArr || '').trim();
      let arrivalNote = '';
      if (!arrival) {
        if (hasValidGps && currentSpot) {
          arrival = currentSpot;
          if (isSailing) arrivalNote = ' (현위치 추정)';
        } else {
          arrival = '-';
        }
      }

      return { departure, arrival, arrivalNote };
    }

    // 🔒 [보안 강화] XSS 예방 문자열 필터링 함수
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 서버 연결 상태 실시간 감지
    const connectedRef = db.ref(".info/connected");
    connectedRef.on("value", (snap) => {
      const serverBadge = document.getElementById("server-badge");
      const serverText = document.getElementById("server-text");
      if (snap.val() === true) {
        serverBadge.classList.remove("disconnected");
        serverText.innerText = "서버 실시간 연결됨";
      } else {
        serverBadge.classList.add("disconnected");
        serverText.innerText = "서버 연결 끊김";
      }
    });

    const shipMarkers = {};
    const shipTrails = {};
    const shipPolylines = {};
    let showTrails = true;
    let latestShipsData = {};
    const expandedShipKeys = new Set();

    function extractExternalPoints(ship) {
      const raw = ship.track || ship.route || ship.path || ship.history || ship.trail;
      if (!raw) return [];
      const list = Array.isArray(raw) ? raw : Object.values(raw);
      const pts = [];
      for (const item of list) {
        if (!item) continue;
        const lat = Number(item.lat ?? item.latitude ?? (Array.isArray(item) ? item[0] : NaN));
        const lng = Number(item.lng ?? item.lon ?? item.longitude ?? (Array.isArray(item) ? item[1] : NaN));
        if (lat > 0 && lng > 0 && !isNaN(lat) && !isNaN(lng)) {
          pts.push([lat, lng]);
        }
      }
      return pts;
    }

    function updateShipTrail(key, ship, color) {
      const hasValidGps = Boolean(ship.lat && ship.lng && Number(ship.lat) > 0 && Number(ship.lng) > 0);
      const extPts = extractExternalPoints(ship);

      if (extPts.length > 0) {
        shipTrails[key] = extPts;
      } else if (hasValidGps) {
        const lat = Number(ship.lat);
        const lng = Number(ship.lng);
        if (!shipTrails[key]) shipTrails[key] = [];
        const arr = shipTrails[key];
        const last = arr[arr.length - 1];
        if (!last || Math.hypot(last[0] - lat, last[1] - lng) > 0.00001) {
          arr.push([lat, lng]);
          if (arr.length > 1000) arr.shift();
        }
      }

      const coords = shipTrails[key] || [];
      if (coords.length >= 2 && showTrails) {
        if (shipPolylines[key]) {
          shipPolylines[key]
            .setLatLngs(coords)
            .setStyle({ color: color, weight: 4.5, opacity: 0.9 });
          if (!map.hasLayer(shipPolylines[key])) {
            shipPolylines[key].addTo(map);
          }
        } else {
          shipPolylines[key] = L.polyline(coords, {
            color: color,
            weight: 4.5,
            opacity: 0.9,
            lineJoin: 'round'
          }).addTo(map);
        }
      } else if (shipPolylines[key]) {
        map.removeLayer(shipPolylines[key]);
      }
    }

    // 궤적 표시/숨김 및 초기화 버튼
    const btnToggleTrails = document.getElementById('btn-toggle-trails');
    btnToggleTrails.addEventListener('click', () => {
      showTrails = !showTrails;
      btnToggleTrails.classList.toggle('active-trail', showTrails);
      btnToggleTrails.innerText = showTrails ? '〰️ 궤적 표시 중' : '〰️ 궤적 숨김';

      Object.keys(shipPolylines).forEach(k => {
        if (showTrails && (shipTrails[k] || []).length >= 2) {
          shipPolylines[k].addTo(map);
        } else {
          map.removeLayer(shipPolylines[k]);
        }
      });
    });

    document.getElementById('btn-clear-trails').addEventListener('click', () => {
      Object.keys(shipTrails).forEach(k => {
        const ship = latestShipsData[k];
        if (ship && ship.lat && ship.lng && Number(ship.lat) > 0 && Number(ship.lng) > 0) {
          shipTrails[k] = [[Number(ship.lat), Number(ship.lng)]];
        } else {
          shipTrails[k] = [];
        }
      });
      Object.keys(shipPolylines).forEach(k => {
        map.removeLayer(shipPolylines[k]);
        delete shipPolylines[k];
      });
    });

    // 전체 펼치기 / 접기 버튼
    document.getElementById('btn-expand-all').addEventListener('click', () => {
      Object.keys(latestShipsData).forEach(key => expandedShipKeys.add(key));
      document.querySelectorAll('.vessel-card').forEach(card => {
        card.classList.add('expanded');
        const btn = card.querySelector('.btn-expand');
        if (btn) btn.innerText = '▲ 접기';
      });
    });

    document.getElementById('btn-collapse-all').addEventListener('click', () => {
      expandedShipKeys.clear();
      document.querySelectorAll('.vessel-card').forEach(card => {
        card.classList.remove('expanded');
        const btn = card.querySelector('.btn-expand');
        if (btn) btn.innerText = '▼ 펼치기';
      });
    });

    // 날짜/시간 파싱 보조 함수
    function parseTimeString(timeStr) {
      if (!timeStr || timeStr === '-') return null;
      if (typeof timeStr === 'number') return new Date(timeStr);

      if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(timeStr)) {
        const parts = timeStr.split(':');
        const d = new Date();
        d.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10), parts[2] ? parseInt(parts[2], 10) : 0, 0);
        return d;
      }
      
      const parsed = new Date(timeStr);
      return isNaN(parsed.getTime()) ? null : parsed;
    }

    // ⏱️ 실시간 운항 시간 포맷팅 계산
    function calculateDuration(startStr, endStr, isOperating) {
      const start = parseTimeString(startStr);
      if (!start) return '-';

      let end = parseTimeString(endStr);
      if (!end && isOperating) {
        end = new Date();
      }

      if (!end) return '-';

      let diffMs = end - start;
      if (diffMs < 0) return '-';

      const totalSec = Math.floor(diffMs / 1000);
      const hours = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;

      if (hours > 0) {
        return `${hours}시간 ${mins}분 ${secs}초`;
      } else if (mins > 0) {
        return `${mins}분 ${secs}초`;
      } else {
        return `${secs}초`;
      }
    }

    // ⚡ [실시간성 강화] 1초 타이머로 매초 운항시간 자동 카운트업
    setInterval(() => {
      Object.keys(latestShipsData).forEach(key => {
        const ship = latestShipsData[key];
        const durationElem = document.getElementById(`duration-${encodeURIComponent(key)}`);
        const miniDurationElem = document.getElementById(`mini-duration-${encodeURIComponent(key)}`);
        
        const hasValidGps = Boolean(ship.lat && ship.lng && Number(ship.lat) > 0 && Number(ship.lng) > 0);
        const isSailing = Boolean(hasValidGps && ship.startTime && ship.startTime !== '-' && (!ship.endTime || ship.endTime === '-') && ship.isOperating !== false);
        
        const formatted = calculateDuration(ship.startTime, ship.endTime, isSailing);
        if (durationElem) durationElem.innerText = formatted;
        if (miniDurationElem) miniDurationElem.innerText = formatted;
      });
    }, 1000);

    // 🔄 Realtime Database 실시간 이벤트 수신
    db.ref('ships').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      latestShipsData = data;

      const vesselList = document.getElementById('vessel-list');
      vesselList.innerHTML = '';

      const keys = Object.keys(data);
      document.getElementById('total-ships-count').innerText = keys.length;
      
      const totalChips = [];
      const sailingChips = [];
      const waitingChips = [];
      const releasedChips = [];

      if (keys.length === 0) {
        vesselList.innerHTML = `<div style="text-align:center; color:var(--text-sub); padding:32px 12px; font-size:1.05rem;">현재 등록되거나 접속 중인 선박이 없습니다.</div>`;
      }

      // 🌐 [스마트 인접 거리 감지 및 동적 분산 알고리즘]
      const validShips = [];
      keys.forEach(key => {
        const ship = data[key];
        if (ship.lat && ship.lng && Number(ship.lat) > 0 && Number(ship.lng) > 0) {
          validShips.push({ key, lat: Number(ship.lat), lng: Number(ship.lng) });
        }
      });

      const proximityThreshold = 0.00015;
      const clusters = [];
      
      validShips.forEach(ship => {
        let placed = false;
        for (let cluster of clusters) {
          const first = cluster[0];
          const dist = Math.hypot(ship.lat - first.lat, ship.lng - first.lng);
          if (dist < proximityThreshold) {
            cluster.push(ship);
            placed = true;
            break;
          }
        }
        if (!placed) {
          clusters.push([ship]);
        }
      });

      const renderCoords = {};
      clusters.forEach(cluster => {
        if (cluster.length === 1) {
          renderCoords[cluster[0].key] = { lat: cluster[0].lat, lng: cluster[0].lng };
        } else {
          const centerLat = cluster.reduce((sum, s) => sum + s.lat, 0) / cluster.length;
          const centerLng = cluster.reduce((sum, s) => sum + s.lng, 0) / cluster.length;
          
          cluster.forEach((ship, index) => {
            const angle = (index * 2 * Math.PI) / cluster.length;
            const radius = 0.00018 + (cluster.length * 0.00003);
            const dLat = radius * Math.cos(angle);
            const dLng = (radius * Math.sin(angle)) / Math.cos(centerLat * Math.PI / 180);
            renderCoords[ship.key] = { lat: centerLat + dLat, lng: centerLng + dLng };
          });
        }
      });

      keys.forEach(key => {
        const ship = data[key];
        const shipColor = getShipColor(key, ship.shipName);
        const shipDisplayName = escapeHtml(ship.shipName || key);
        const chipItem = { name: shipDisplayName, color: shipColor };
        totalChips.push(chipItem);
        
        let tripStatusText = '';
        let statusClass = '';

        const hasStartTime = Boolean(ship.startTime && ship.startTime !== '-');
        const hasEndTime = Boolean(ship.endTime && ship.endTime !== '-');
        const hasValidGps = Boolean(ship.lat && ship.lng && Number(ship.lat) > 0 && Number(ship.lng) > 0);

        if (!hasValidGps || ship.isOperating === false) {
          tripStatusText = '운항해제';
          statusClass = 'released';
          releasedChips.push(chipItem);
        } else if (hasStartTime && hasEndTime) {
          tripStatusText = '대기중';
          statusClass = 'waiting';
          waitingChips.push(chipItem);
        } else if (hasStartTime && !hasEndTime) {
          tripStatusText = '운항중';
          statusClass = 'sailing';
          sailingChips.push(chipItem);
        } else {
          tripStatusText = '대기중';
          statusClass = 'waiting';
          waitingChips.push(chipItem);
        }

        const isSailing = (statusClass === 'sailing');
        const { departure, arrival, arrivalNote } = resolveDepartureAndArrival(
          key, ship, hasValidGps, isSailing, hasEndTime
        );
        const depSafe = escapeHtml(departure);
        const arrSafe = escapeHtml(arrival);
        const arrNoteSafe = escapeHtml(arrivalNote);

        const startTimeText = escapeHtml(ship.startTime) || '-';
        const endTimeText = escapeHtml(ship.endTime) || '-';
        const durationText = calculateDuration(ship.startTime, ship.endTime, isSailing);
        const speedFormatted = `${(Number(ship.speedKts) || 0).toFixed(1)} Kts`;

        const latText = hasValidGps ? (Number(ship.lat)).toFixed(4) : '<span style="color:#fca5a5; font-weight:700;">미수신</span>';
        const lngText = hasValidGps ? (Number(ship.lng)).toFixed(4) : '<span style="color:#fca5a5; font-weight:700;">미수신</span>';

        const isExpanded = expandedShipKeys.has(key);
        const card = document.createElement('div');
        card.className = `vessel-card ${statusClass}${isExpanded ? ' expanded' : ''}`;
        card.style.borderLeftColor = shipColor;
        
        const encKey = encodeURIComponent(key);

        card.innerHTML = `
          <div class="vessel-card-top">
            <div class="vessel-header-left">
              <span class="vessel-name">
                <span class="ship-color-dot" style="background:${shipColor}; color:${shipColor};"></span>
                🚢 ${shipDisplayName}
              </span>
              <span class="vessel-status-tag ${statusClass}">${escapeHtml(tripStatusText)}</span>
            </div>
            <div class="vessel-header-right">
              <div class="vessel-mini-meta">
                <span style="color:${shipColor}">${speedFormatted}</span>
                <span>·</span>
                <span id="mini-duration-${encKey}" style="color:var(--accent-yellow)">${durationText}</span>
              </div>
              <button type="button" class="btn-expand">${isExpanded ? '▲ 접기' : '▼ 펼치기'}</button>
            </div>
          </div>
          <div class="vessel-route-summary">
            <span>출발: <strong style="color:${shipColor}">${depSafe}</strong></span>
            <span class="route-arrow">→</span>
            <span>도착: <strong style="color:#ffffff">${arrSafe}</strong><span style="font-size:0.85rem; color:var(--text-sub);">${arrNoteSafe}</span></span>
          </div>
          <div class="vessel-detail-section">
            <div class="vessel-info-grid">
              <div>출발지: <strong style="color:${shipColor}">${depSafe}</strong></div>
              <div>도착지: <strong style="color:#ffffff">${arrSafe}${arrNoteSafe}</strong></div>
              <div>속도: <strong style="color:${shipColor}">${speedFormatted}</strong></div>
              <div>운항시간: <strong id="duration-${encKey}" style="color:var(--accent-yellow)">${durationText}</strong></div>
              <div>출항시각: <strong style="color:#7dd3fc">${startTimeText}</strong></div>
              <div>도착시각: <strong style="color:#fca5a5">${endTimeText}</strong></div>
              <div>위도: ${latText}</div>
              <div>경도: ${lngText}</div>
            </div>
            <div class="vessel-action-group">
              <button type="button" class="btn-action btn-locate">📍 위치 보기</button>
              <button type="button" class="btn-action btn-force-stop">🛑 강제 해제</button>
            </div>
          </div>
        `;

        const expandBtn = card.querySelector('.btn-expand');
        expandBtn.addEventListener('click', () => {
          const nextExpanded = !card.classList.contains('expanded');
          card.classList.toggle('expanded', nextExpanded);
          expandBtn.innerText = nextExpanded ? '▲ 접기' : '▼ 펼치기';
          if (nextExpanded) {
            expandedShipKeys.add(key);
          } else {
            expandedShipKeys.delete(key);
          }
        });

        const locateBtn = card.querySelector('.btn-locate');
        locateBtn.addEventListener('click', () => focusShip(ship.lat, ship.lng, key));

        const stopBtn = card.querySelector('.btn-force-stop');
        stopBtn.addEventListener('click', () => forceStopShip(key, ship.shipName || key));

        vesselList.appendChild(card);

        // 〰️ 선박 궤적 업데이트
        updateShipTrail(key, ship, shipColor);

        // 🗺️ 지도 마커 업데이트
        if (hasValidGps && renderCoords[key]) {
          const rCoord = renderCoords[key];
          
          const icon = L.divIcon({
            className: '',
            html: `<div class="admin-ship-badge" style="color:${shipColor}; border:2.5px solid ${shipColor};">🚢 ${shipDisplayName}<br><span style="font-size:13px; color:#ffffff;">[${escapeHtml(tripStatusText)}] ${speedFormatted}</span></div>`,
            iconSize: [150, 54],
            iconAnchor: [75, 27]
          });

          const popupContent = `
            <div style="color:#000; text-align:center; padding:6px; font-size:14px;">
              <strong style="font-size:15px;">🚢 ${shipDisplayName}</strong><br>
              <span>상태: <strong>${escapeHtml(tripStatusText)}</strong></span><br>
              <span>출발: <strong>${depSafe}</strong> → 도착: <strong>${arrSafe}</strong></span><br>
              <span>속도: ${speedFormatted}</span>
            </div>
          `;

          if (shipMarkers[key]) {
            shipMarkers[key].setLatLng([rCoord.lat, rCoord.lng]).setIcon(icon).setPopupContent(popupContent);
          } else {
            shipMarkers[key] = L.marker([rCoord.lat, rCoord.lng], { icon: icon })
                                .bindPopup(popupContent)
                                .addTo(map);
          }
        } else {
          if (shipMarkers[key]) {
            map.removeLayer(shipMarkers[key]);
            delete shipMarkers[key];
          }
        }
      });

      // 사라진 선박 정리
      expandedShipKeys.forEach(k => {
        if (!data[k]) expandedShipKeys.delete(k);
      });

      document.getElementById('sailing-ships-count').innerText = sailingChips.length;
      document.getElementById('waiting-ships-count').innerText = waitingChips.length;
      document.getElementById('released-ships-count').innerText = releasedChips.length;

      renderShipNameChips('total-ships-names', totalChips, '');
      renderShipNameChips('sailing-ships-names', sailingChips, 'sailing');
      renderShipNameChips('waiting-ships-names', waitingChips, 'waiting');
      renderShipNameChips('released-ships-names', releasedChips, 'released');

      Object.keys(shipMarkers).forEach(k => {
        if (!data[k]) {
          map.removeLayer(shipMarkers[k]);
          delete shipMarkers[k];
        }
      });

      Object.keys(shipPolylines).forEach(k => {
        if (!data[k]) {
          map.removeLayer(shipPolylines[k]);
          delete shipPolylines[k];
          delete shipTrails[k];
        }
      });
    });

    function renderShipNameChips(elementId, chipsArray, statusClass) {
      const container = document.getElementById(elementId);
      if (!container) return;
      if (chipsArray.length === 0) {
        container.innerHTML = `<span style="font-size:0.9rem; color:var(--text-sub);">-</span>`;
      } else {
        container.innerHTML = chipsArray.map(item => 
          `<span class="ship-name-chip ${statusClass}"><span class="ship-color-dot" style="background:${item.color}; color:${item.color};"></span>${item.name}</span>`
        ).join('');
      }
    }

    function focusShip(lat, lng, shipKey) {
      const numLat = Number(lat);
      const numLng = Number(lng);

      if (numLat > 0 && numLng > 0 && !isNaN(numLat) && !isNaN(numLng)) {
        map.flyTo([numLat, numLng], 17, { duration: 1.2 });

        if (shipKey && shipMarkers[shipKey]) {
          setTimeout(() => {
            shipMarkers[shipKey].openPopup();
          }, 600);
        }

        const mapElement = document.getElementById('map');
        if (mapElement) {
          mapElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      } else {
        alert("해당 선박의 유효한 GPS 위치 정보가 없습니다.");
      }
    }

    // 🛑 개별 선박 원격 강제 운항 해제
    function forceStopShip(shipKey, shipName) {
      if (confirm(`[${shipName}] 선박의 운항을 강제로 해제하시겠습니까?`)) {
        const nowTime = new Date().toLocaleTimeString('ko-KR', { hour12: false });
        const ship = latestShipsData[shipKey] || {};
        const currentSpot = (ship.lat && ship.lng && Number(ship.lat) > 0 && Number(ship.lng) > 0)
          ? findNearestLandmark(ship.lat, ship.lng)
          : '';
        const updatePayload = {
          isOperating: false,
          endTime: nowTime,
          speedKts: 0
        };
        if (currentSpot && !ship.arrival && !ship.destination) {
          updatePayload.arrival = currentSpot;
        }
        db.ref('ships/' + shipKey).update(updatePayload)
        .then(() => {
          console.log(`[Success] 선박 강제 해제 완료: ${shipKey}`);
          alert(`[${shipName}] 선박이 강제 운항 해제되었습니다.`);
        })
        .catch((err) => {
          console.error("[Error] 선박 강제 해제 실패:", err);
          alert("처리 중 오류가 발생했습니다: " + err.message);
        });
      }
    }

    // 🚨 전체 선박 원격 일괄 강제 운항 해제
    document.getElementById('btn-force-all').addEventListener('click', forceStopAllShips);

    function forceStopAllShips() {
      if (confirm('🚨 현재 등록된 모든 선박의 운항을 일괄 강제로 해제하시겠습니까?')) {
        const nowTime = new Date().toLocaleTimeString('ko-KR', { hour12: false });
        db.ref('ships').once('value', (snapshot) => {
          const data = snapshot.val();
          if (!data) {
            alert("등록된 선박 데이터가 없습니다.");
            return;
          }

          const updates = {};
          Object.keys(data).forEach(key => {
            const ship = data[key] || {};
            const currentSpot = (ship.lat && ship.lng && Number(ship.lat) > 0 && Number(ship.lng) > 0)
              ? findNearestLandmark(ship.lat, ship.lng)
              : '';
            updates[`ships/${key}/isOperating`] = false;
            updates[`ships/${key}/endTime`] = nowTime;
            updates[`ships/${key}/speedKts`] = 0;
            if (currentSpot && !ship.arrival && !ship.destination) {
              updates[`ships/${key}/arrival`] = currentSpot;
            }
          });

          db.ref().update(updates)
            .then(() => {
              console.log("[Success] 전체 선박 일괄 강제 해제 완료");
              alert("전체 선박의 운항이 성공적으로 강제 해제되었습니다.");
            })
            .catch((err) => {
              console.error("[Error] 전체 선박 일괄 해제 실패:", err);
              alert("처리 중 오류가 발생했습니다: " + err.message);
            });
        });
      }
    }
  </script>
</body>
</html>
